<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Email Berhasil Diverifikasi</title>

<style>
    * {
    box-sizing: border-box;
    }

    body {
    margin: 0;
    padding: 24px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f7fb;
    font-family: Arial, Helvetica, sans-serif;
    color: #1f2937;
    }

    .container {
    width: 100%;
    max-width: 520px;
    background: white;
    border-radius: 24px;
    padding: 48px 32px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .logo {
    width: 88px;
    max-width: 100%;
    height: auto;
    object-fit: contain;
    margin-bottom: 28px;
    }

    .icon-wrapper {
    width: 96px;
    height: 96px;
    border-radius: 999px;
    background: #dcfce7;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 28px;
    }

    .check-icon {
    width: 42px;
    height: 42px;
    color: #16a34a;
    }

    h1 {
    margin: 0 0 16px;
    font-size: 32px;
    line-height: 40px;
    font-weight: 700;
    }

    p {
    margin: 0;
    font-size: 16px;
    line-height: 28px;
    color: #6b7280;
    }

    .button {
    display: inline-block;
    margin-top: 36px;
    padding: 16px 28px;
    background: #2563eb;
    color: white;
    text-decoration: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 600;
    transition: 0.2s ease;
    }

    .button:hover {
    background: #1d4ed8;
    }

    .footer {
    margin-top: 32px;
    font-size: 13px;
    color: #9ca3af;
    }

    @media (max-width: 640px) {
    .container {
        padding: 40px 24px;
    }

    h1 {
        font-size: 28px;
        line-height: 36px;
    }
    }
</style>
</head>
<body>

<div class="container">

    <img
    src="http://localhost:3000/logo"
    alt="Logo"
    class="logo"
    />

    <div class="icon-wrapper">
    <svg
        xmlns="http://www.w3.org/2000/svg"
        class="check-icon"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2.5"
    >
        <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M5 13l4 4L19 7"
        />
    </svg>
    </div>

    <h1>Email Berhasil Diverifikasi</h1>

    <p>
    Akun Anda telah berhasil diverifikasi.
    Sekarang Anda dapat melanjutkan dan menggunakan seluruh fitur aplikasi.
    </p>

    <div class="footer">
    © 2026 Suara Mawa. All rights reserved.
    </div>

</div>

</body>
</html>
