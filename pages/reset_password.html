<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Suara Mawa</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Inter, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f7fb;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 20px;
            padding: 32px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }

        .logo {
            width: 100px;
            margin-bottom: 24px;
        }

        h1 {
            margin-bottom: 12px;
            color: #111827;
        }

        p {
            color: #6b7280;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: .7;
            cursor: not-allowed;
        }

        .message {
            margin-top: 16px;
            padding: 12px;
            border-radius: 12px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #9ca3af;
        }
        .password-rules {
            margin-top: 10px;
            text-align: left;
            font-size: 14px;
        }

        .password-rule {
            margin: 4px 0;
            color: #9ca3af; /* abu-abu */
            transition: color .2s ease;
        }

        .password-rule.valid {
            color: #16a34a; /* hijau */
            font-weight: 500;
        }
    </style>
</head>

<body>

<div class="container">

    <img
        src="https://api.suara-mawa.ariear.my.id/logo"
        alt="Logo"
        class="logo"
    />

    <h1>Reset Password</h1>

    <p>
        Masukkan password baru untuk akun Anda.
    </p>

    <form id="resetForm">
        <div class="form-group">
            <label>Password Baru</label>

            <input
                type="password"
                id="password"
                required
                minlength="8"
            />

            <div class="password-rules">
                <div id="rule-length" class="password-rule">
                    ✓ Minimal 8 karakter
                </div>

                <div id="rule-upper" class="password-rule">
                    ✓ Minimal 1 huruf besar (A-Z)
                </div>

                <div id="rule-lower" class="password-rule">
                    ✓ Minimal 1 huruf kecil (a-z)
                </div>

                <div id="rule-number" class="password-rule">
                    ✓ Minimal 1 angka (0-9)
                </div>

                <div id="rule-special" class="password-rule">
                    ✓ Minimal 1 karakter spesial (!@#$&*~)
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>Konfirmasi Password</label>
            <input
                type="password"
                id="confirmPassword"
                required
                minlength="8"
            />
        </div>

        <button type="submit">
            Simpan Password Baru
        </button>
    </form>

    <div id="message" class="message"></div>

    <div class="footer">
        © 2026 Suara Mawa. All rights reserved.
    </div>

</div>

<script>
const token = new URLSearchParams(window.location.search).get("token");

const form = document.getElementById("resetForm");
const message = document.getElementById("message");

if (!token) {
    message.style.display = "block";
    message.className = "message error";
    message.innerText = "Token reset password tidak ditemukan.";
    form.style.display = "none";
}

const passwordInput = document.getElementById("password");

function updatePasswordRules(password) {
    document
        .getElementById("rule-length")
        .classList.toggle(
            "valid",
            password.length >= 8
        );

    document
        .getElementById("rule-upper")
        .classList.toggle(
            "valid",
            /[A-Z]/.test(password)
        );

    document
        .getElementById("rule-lower")
        .classList.toggle(
            "valid",
            /[a-z]/.test(password)
        );

    document
        .getElementById("rule-number")
        .classList.toggle(
            "valid",
            /[0-9]/.test(password)
        );

    document
        .getElementById("rule-special")
        .classList.toggle(
            "valid",
            /[!@#\$&*~]/.test(password)
        );
}

passwordInput.addEventListener("input", (e) => {
    updatePasswordRules(e.target.value);
});

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const password = document.getElementById("password").value;
    const confirmPassword =
        document.getElementById("confirmPassword").value;
    if (
        password.length < 8 ||
        !/[A-Z]/.test(password) ||
        !/[a-z]/.test(password) ||
        !/[0-9]/.test(password) ||
        !/[!@#\$&*~]/.test(password)
    ) {
        message.style.display = "block";
        message.className = "message error";
        message.innerText =
            "Password belum memenuhi seluruh persyaratan.";
        return;
    }
    if (password !== confirmPassword) {
        message.style.display = "block";
        message.className = "message error";
        message.innerText = "Konfirmasi password tidak cocok.";
        return;
    }

    try {
        const response = await fetch(
            "https://manifesto-sincere-domelike.ngrok-free.dev/api/auth/reset-password",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    token,
                    newPassword: password
                })
            }
        );

        const result = await response.json();

        if (!response.ok) {
            throw new Error(
                result.message || "Gagal reset password"
            );
        }

        message.style.display = "block";
        message.className = "message success";
        message.innerText =
            "Password berhasil diperbarui. Silakan login kembali.";

        form.reset();

        setTimeout(() => {
            window.location.href =
                "http://manifesto-sincere-domelike.ngrok-free.dev/reset-password/success";
        }, 3000);

    } catch (err) {
        message.style.display = "block";
        message.className = "message error";
        message.innerText = err.message;
    }
});
</script>

</body>
</html>
